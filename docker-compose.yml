services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  face:
    build: ./face-service
    restart: unless-stopped
    environment:
      FACE_INTERNAL_KEY: ${FACE_INTERNAL_KEY:-dev-face-key-change-me}
    ports:
      - "8000:8000"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/lecture_attendance
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      EMBEDDING_KEY: ${EMBEDDING_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      FACE_SERVICE_URL: http://face:8000
      FACE_INTERNAL_KEY: ${FACE_INTERNAL_KEY:-dev-face-key-change-me}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.75}
      MATCH_MARGIN: ${MATCH_MARGIN:-0.06}
      UNIVERSITY_NAME: ${UNIVERSITY_NAME:-University of Ghana}
      POLICY_VERSION: ${POLICY_VERSION:-1.0}
      EXPOSE_OTP: "true"
      STUDENT_SIGNUP_KEY: ${STUDENT_SIGNUP_KEY:-legon-pilot}
      INACTIVITY_MINUTES: ${INACTIVITY_MINUTES:-30}
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - face

volumes:
  mongo-data:
